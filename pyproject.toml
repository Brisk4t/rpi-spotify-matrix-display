[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-spotify-matrix-display"
version = "2.0.0"
description = "Raspberry Pi Spotify Matrix Display"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Kyle Johnson", email = "kyjohnson09@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "paho-mqtt>=2.0",
    "requests",
    "spotipy",
]

[project.optional-dependencies]
# Only for lyrics_provider = librelyrics; the built-in lyrics client needs nothing extra
librelyrics = [
    "librelyrics",
    "librelyrics-spotify",
]
emulator = [
    "RGBMatrixEmulator",
    "pygame",
]

[project.urls]
Homepage = "https://github.com/kylejohnsonkj/rpi-spotify-matrix-display"

[project.scripts]
spotify-matrix = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["views*", "player*", "services*", "utils*"]
