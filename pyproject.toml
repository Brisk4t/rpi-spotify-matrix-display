[build-system]
requires = ["setuptools>=78.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi-spotify-matrix-display"
version = "2.0.0"
description = "Raspberry Pi Spotify Matrix Display"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "Kyle Johnson", email = "kyjohnson09@gmail.com" },
]
requires-python = ">=3.9"
dependencies = [
    "Pillow",
    "requests",
    "spotipy",
    # Lyrics are optional; librelyrics requires Python 3.10+
    "librelyrics ; python_version >= '3.10'",
    "librelyrics-spotify ; python_version >= '3.10'",
]

[project.optional-dependencies]
emulator = [
    "RGBMatrixEmulator",
    "pygame",
]

[project.urls]
Homepage = "https://github.com/kylejohnsonkj/rpi-spotify-matrix-display"

[project.scripts]
spotify-matrix = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["views*", "player*", "services*", "utils*"]
